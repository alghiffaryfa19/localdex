name: Release

on:
  push:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Debug builds are signed with the runner's auto-generated debug keystore.
      # Cache it under a fixed key so every release carries the same signature —
      # otherwise each tag would need an uninstall/reinstall on the device.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/localdex-debug.apk
          ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: release/*.apk
          retention-days: 7
          if-no-files-found: error
